
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Car Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <h1 class="login-title">Car Login</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="loginType">
                    <i class="icon">🔲</i> Select Login Type
                </label>
                <select id="loginType" name="loginType" required>
                    <option value="simulator">Simulator</option>
                    <option value="dashboard">Dashboard View</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">
                    <i class="icon">👤</i> Username
                </label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="icon">🔒</i> Password
                </label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-button">Login</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
