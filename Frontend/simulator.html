<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Data Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="top-nav">
            <div class="nav-links">
                <a href="simulator.html" class="nav-link active">Simulator</a>
                <a href="login.html" class="nav-link" onclick="logout()">Log Out</a>
            </div>
            <div class="car-id">
                SIMULATOR MODE<br>
                <span>BR 06 GX 5643</span>
            </div>
        </nav>

        <main class="simulator-content">
            <h1 class="simulator-title">Car Data Simulator</h1>
            
            <div class="simulator-grid">
                <!-- Tire Pressure Section -->
                <div class="simulator-card">
                    <h2>Tire Pressure (PSI)</h2>
                    <div class="input-grid">
                        <div class="input-group">
                            <label for="tire_pressure_1">Front Left (FL)</label>
                            <input type="number" id="tire_pressure_1" min="0" max="60" step="0.1" value="32">
                            <div class="slider-container">
                                <input type="range" id="tire_pressure_1Slider" min="0" max="60" step="0.1" value="32">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="tire_pressure_2">Front Right (FR)</label>
                            <input type="number" id="tire_pressure_2" min="0" max="60" step="0.1" value="32">
                            <div class="slider-container">
                                <input type="range" id="tire_pressure_2Slider" min="0" max="60" step="0.1" value="32">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="tire_pressure_3">Rear Left (RL)</label>
                            <input type="number" id="tire_pressure_3" min="0" max="60" step="0.1" value="31">
                            <div class="slider-container">
                                <input type="range" id="tire_pressure_3Slider" min="0" max="60" step="0.1" value="31">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="tire_pressure_4">Rear Right (RR)</label>
                            <input type="number" id="tire_pressure_4" min="0" max="60" step="0.1" value="32">
                            <div class="slider-container">
                                <input type="range" id="tire_pressure_4Slider" min="0" max="60" step="0.1" value="32">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Temperature Section -->
                <div class="simulator-card">
                    <h2>Temperature</h2>
                    <div class="input-group">
                        <label for="temp">Temperature (°C)</label>
                        <input type="number" id="temp" min="-20" max="60" step="0.1" value="27">
                        <div class="slider-container">
                            <input type="range" id="tempSlider" min="-20" max="60" step="0.1" value="27">
                        </div>
                        <p class="temp-display">
                            <span id="tempKelvin">300.15</span> K | 
                            <span id="tempCelsius">27.0</span> °C
                        </p>
                    </div>
                </div>

                <!-- Seatbelt Section -->
                <div class="simulator-card">
                    <h2>Seatbelt Status</h2>
                    <div class="toggle-group">
                        <label class="toggle-switch">
                            <input type="checkbox" id="seatbelt">
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="toggle-label" id="seatbeltLabel">Unbuckled</span>
                    </div>
                </div>

                <!-- Car Visualization -->
                <div class="simulator-card visualization-card">
                    <h2>Live Preview</h2>
                    <div class="mini-car-view">
                        <!--<svg viewBox="0 0 200 300" class="mini-car-svg">
                            <rect x="30" y="30" width="140" height="240" rx="15" fill="#fff" stroke="#00d4ff" stroke-width="2"/>
                            <rect x="45" y="50" width="110" height="100" rx="8" fill="#1a1a2e"/>
                            <rect x="45" y="170" width="110" height="85" rx="8" fill="#1a1a2e"/>
                        </svg>-->
                        <img src="image.png" alt="Car" class="car-image">
                        
                        <div class="mini-sensor mini-fl">
                            <span id="previewtire_pressure_1">32</span>
                        </div>
                        <div class="mini-sensor mini-fr">
                            <span id="previewtire_pressure_2">32</span>
                        </div>
                        <div class="mini-sensor mini-rl">
                            <span id="previewtire_pressure_3">31</span>
                        </div>
                        <div class="mini-sensor mini-rr">
                            <span id="previewtire_pressure_4">32</span>
                        </div>
                    </div>
                    <div class="preview-info">
                        <p>Temp: <span id="previewTemp">27°C</span></p>
                        <p>Seatbelt: <span id="previewSeatbelt">Unbuckled</span></p>
                    </div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="control-buttons">
                <button class="btn-preset" onclick="setNormalData()">
                    ✓ Normal Values
                </button>
                <button class="btn-preset warning" onclick="setWarningData()">
                    ⚠ Warning Values
                </button>
                <button class="btn-preset critical" onclick="setCriticalData()">
                    ⚡ Critical Values
                </button>
                <button class="btn-random" onclick="setRandomData()">
                    🎲 Random Values
                </button>
            </div>

            <div class="submit-section">
                <button type="button" class="btn-submit" id="submitBtn">
                    <span class="btn-icon">📤</span>
                    Send Data to System
                </button>
                <div id="statusMessage" class="status-message"></div>
            </div>

            <!-- Recent Submissions -->
            <div class="recent-submissions">
                <h2>Recent Submissions</h2>
                <div id="submissionHistory" class="submission-list"></div>
            </div>
        </main>
    </div>

    <script src="auth-check.js"></script>
    <script src="simulator.js"></script>
</body>
</html>
